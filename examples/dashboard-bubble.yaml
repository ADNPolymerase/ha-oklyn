# ----------------------------------------------------------------------
# Water quality — Pool Monitor Card
# ----------------------------------------------------------------------
- type: custom:pool-monitor-card
  display:
    compact: false
    show_names: true
    show_labels: false
    show_last_updated: true
    show_icons: true
    show_units: true
    gradient: true
    language: fr
  sensors:
    temperature:
      - entity: sensor.oklyn_temperature_air
        name: AIR
        setpoint: 30
        step: 5
      - entity: sensor.oklyn_temperature_eau
        name: PISCINE
        setpoint: 27
        step: 3
    ph:
      - entity: sensor.oklyn_ph
        setpoint: 7.2
        step: 0.2
    orp:
      - entity: sensor.oklyn_redox
        name: Redox Chlore
        setpoint: 650
  colors:
    low: "#fdcb6e"
    warn: "#e17055"
    normal: "#00b894"
    cool: "#00BFFF"
    marker: "#000000"
    hi_low: "#00000099"
